# 모든 PR의 형식·비밀값을 검사한다. 세 레포 공통 부분은 같게 유지한다.
# 실패(❌)해도 GitHub Free·브랜치 보호 없이 운영하므로 머지가 자동으로 막히지 않는다.
# ❌인 PR은 머지하지 않는다 (CONTRIBUTING 5장). error = 차단 기준, warning = 리뷰 때 확인.
name: pr-check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 형식 검사
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          FREEZE: ${{ vars.FEATURE_FREEZE }}
        run: |
          fail=0
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "::error::main에는 develop만 머지합니다 (릴리스 PR)."; exit 1
            fi
            echo "릴리스 PR: 형식 검사 생략"; exit 0
          fi

          branch_re='^(feature|fix|docs|chore)/#[0-9]+-[a-z0-9-]+$'
          if ! [[ "$HEAD" =~ $branch_re ]]; then
            echo "::error::브랜치 이름은 feature|fix|docs|chore/#이슈번호-영문-이름 형식이어야 합니다. 현재: $HEAD"; fail=1
          fi

          title_re='^\[#[0-9]+\] .+'
          if ! [[ "$TITLE" =~ $title_re ]]; then
            echo "::error::PR 제목은 [#이슈번호] 제목 형식이어야 합니다."; fail=1
          fi

          # 같은 레포 이슈(#12) 또는 다른 레포 이슈(OneMonthproJect/chagok-docs#12)
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'; then
            echo "::error::PR 본문에 'Closes #이슈번호'가 필요합니다 (머지 시 이슈 자동 클로즈)."; fail=1
          fi

          if [ "$FREEZE" = "true" ] && [[ "$HEAD" == feature/* ]]; then
            echo "::error::관문 2 기능 동결 중입니다. feature/ 브랜치 PR은 머지하지 않습니다 (fix/·docs/만 가능)."; fail=1
          fi
          exit $fail

      - name: 비밀값·민감 파일 검사 (차단)
        if: github.base_ref != 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/secret-scan.sh "$BASE_SHA" "$HEAD_SHA"

      - name: AI 공동 작성자 표기 검사
        if: github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # PR 본문 + 모든 커밋 메시지·작성자. Squash merge 때 커밋 트레일러가 develop 커밋에 그대로 남기 때문에 커밋까지 본다.
          text=$(gh pr view "$PR" --repo "$REPO" --json body,commits -q '
            (.body // ""),
            (.commits[] | (.messageHeadline // ""), (.messageBody // ""),
              (.authors[]? | ((.name // "") + " <" + (.email // "") + ">")))')
          pattern='co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated with \[?claude'
          if printf '%s\n' "$text" | grep -Eiq "$pattern"; then
            printf '%s\n' "$text" | grep -Ein "$pattern" | head -5
            echo "::error::커밋 또는 PR 본문에 AI 공동 작성자 표기가 있습니다. 해당 줄을 지우고 다시 push해 주세요 (CONTRIBUTING 4장). 마지막 커밋이면: git commit --amend 로 메시지 수정 후 git push --force-with-lease"
            exit 1
          fi
          echo "AI 표기 없음"

      - name: 문서 동기화 검사 (프론트 ↔ chagok-docs)
        if: github.base_ref != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changes=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | [.status, .filename] | @tsv')
          files=$(printf '%s\n' "$changes" | cut -f2)
          has() { printf '%s\n' "$files" | grep -Eq "$1"; }
          docs_link=0
          printf '%s' "$BODY" | grep -Eiq 'chagok-docs(#|/pull/|/issues/)[0-9]+' && docs_link=1

          if has '^src/features/[^/]+/(api|types)\.(js|ts)$' && [ $docs_link -eq 0 ]; then
            echo "::warning::features의 api·types가 바뀌었습니다. 08 API 명세(표·JSON 예시)와 같은지 확인해 주세요. 08을 바꿔야 한다면 chagok-docs 문서 PR을 「문서 PR」 칸에 적어 주세요."
          fi
          new_pages=$(printf '%s\n' "$changes" | awk -F'\t' '$1=="added" && $2 ~ /^src\/pages\// {print $2}')
          if [ -n "$new_pages" ]; then
            echo "::warning::새 페이지가 생겼습니다: $(echo $new_pages). 09 화면명세서의 화면 ID(S-xx)와 1:1인지 확인해 주세요."
          fi
          feats=$(printf '%s\n' "$files" | sed -nE 's#^src/features/([^/]+)/.*#\1#p' | sort -u)
          n=$(printf '%s\n' "$feats" | grep -c . || true)
          if [ "$n" -ge 3 ]; then
            echo "::warning::이 PR은 feature $n개를 건드립니다: $(echo $feats). 이슈를 쪼갤 수 있는지 확인해 주세요."
          fi
          exit 0
